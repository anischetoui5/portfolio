<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submitted Messages — Anis</title>
  <script>
    (function () {
      var t; try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=3">
</head>
<body>

  <header class="site-header">
    <nav class="nav container">
      <a href="index.html" class="brand">Anis<span>.</span></a>
      <ul class="nav-links">
        <li><a href="index.html">About</a></li>
        <li><a href="Home.html">Experiences</a></li>
        <li><a href="project.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <div class="section-head">
        <span class="eyebrow">Thanks!</span>
        <h2>Submitted messages</h2>
      </div>
      <div class="entries" id="entries"></div>
    </section>
  </main>

  <script>
    (function () {
      var box = document.getElementById('entries');
      var all = [];
      try { all = JSON.parse(localStorage.getItem('formEntries')) || []; } catch (e) {}
      if (!all.length) {
        box.innerHTML = '<p class="card">No entries yet.</p>';
        return;
      }
      var esc = function (s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
      all.forEach(function (e) {
        var el = document.createElement('article');
        el.className = 'card entry';
        el.innerHTML =
          '<dl>' +
          '<dt>Name</dt><dd>' + esc(e.name) + '</dd>' +
          '<dt>Email</dt><dd>' + esc(e.email) + '</dd>' +
          '<dt>Phone</dt><dd>' + esc(e.phone) + '</dd>' +
          '<dt>Message</dt><dd>' + esc(e.project) + '</dd>' +
          '</dl>';
        box.appendChild(el);
      });
    })();
  </script>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Anis</p>
      <div class="socials">
        <a href="https://www.instagram.com/chetouianisg/" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6" fill="currentColor"/></svg></a>
        <a href="https://mail.google.com/mail/u/1/?pli=1#inbox" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></a>
        <a href="https://fr.linkedin.com" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
      </div>
    </div>
  </footer>

  <script src="main.js?v=2"></script>
</body>
</html>
